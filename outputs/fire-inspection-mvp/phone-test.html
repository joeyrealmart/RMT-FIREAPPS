<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RMT Phone Test</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #172033;
      }
      main {
        width: min(90vw, 420px);
        padding: 24px;
        border: 1px solid #d8e1ef;
        border-radius: 12px;
        background: white;
        box-shadow: 0 12px 28px rgba(23, 32, 51, 0.12);
      }
      strong {
        display: block;
        color: #0b8f3a;
        font-size: 24px;
        margin-bottom: 8px;
      }
      code {
        display: block;
        padding: 12px;
        border-radius: 8px;
        background: #eef4ff;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>Phone connection OK</strong>
      <p>If you can see this page on your phone, the laptop server and WiFi connection are working.</p>
      <code>http://192.168.0.129:8026/</code>
    </main>
  </body>
</html>
